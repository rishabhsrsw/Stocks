name: US weekly picks

on:
  schedule:
    - cron: "17 6 * * 6"   # every Saturday 06:17 UTC (about 01:17 New York), after Friday's close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Generate US picks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: enables the Claude news analyst
        run: python -m stockpicker run --market us
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "US weekly picks $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
