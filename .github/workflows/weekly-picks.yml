name: Weekly picks

on:
  schedule:
    - cron: "47 2 * * 6"   # every Saturday 08:17 IST, after Friday's close
  workflow_dispatch:
    inputs:
      index:
        description: "Universe (nifty100 | nifty200 | nifty500)"
        default: "nifty200"

permissions:
  contents: write

concurrency:
  group: weekly-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Generate picks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: enables the Claude news analyst
        run: python -m stockpicker run --index "${{ github.event.inputs.index || 'nifty200' }}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Weekly picks $(date -u +%Y-%m-%d)"
          git push
